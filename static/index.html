<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF RAG Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▣</span>
      <div>
        <h1>PDF RAG Assistant</h1>
        <span class="subtitle">Answers with citations, sourced only from your PDFs</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="doc-count" class="badge">0 documents</span>
      <span id="qdrant-status" class="badge badge-muted">checking…</span>
      <label class="btn btn-ghost upload-btn" for="pdf-input">＋ Upload PDF</label>
      <input type="file" id="pdf-input" accept=".pdf" multiple hidden>
    </div>
  </header>

  <main class="chat" id="chat">
    <div id="messages" class="messages"></div>

    <div id="welcome" class="welcome">
      <div class="welcome-icon">▣</div>
      <h2>Ask anything about the documents</h2>
      <p class="muted">Answers are generated only from the uploaded PDFs, with citations.</p>
      <div class="welcome-suggestions" id="suggestions"></div>
    </div>

    <div id="ingest-msg" class="ingest-msg" hidden></div>
  </main>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="question-input" rows="1"
                placeholder="Ask a question about the documents…"></textarea>
      <button id="ask-btn" class="btn btn-primary send-btn" disabled aria-label="Send">➤</button>
    </div>
    <p class="composer-hint muted small">Enter to send · Shift+Enter for a new line · Sources: OpenRouter free models</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
