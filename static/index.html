<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF RAG Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button id="new-chat-sidebar-btn" class="new-chat-btn" title="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New Chat</span>
      </button>
      <div id="thread-list" class="thread-list"></div>
      <div class="sidebar-foot">
        <button id="sidebar-toggle-side" class="icon-btn" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span class="sidebar-foot-text">PDF RAG Assistant</span>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="brand">
          <span class="logo">▣</span>
          <h1>PDF RAG Assistant</h1>
        </div>
        <div class="topbar-right">
          <span id="doc-count" class="badge">0 documents</span>
          <label class="upload-btn" for="pdf-input">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            <span>Upload PDF</span>
          </label>
          <input type="file" id="pdf-input" accept=".pdf" multiple hidden>
        </div>
      </header>

      <main class="chat" id="chat">
        <div id="messages" class="messages"></div>

        <div id="welcome" class="welcome">
          <div class="welcome-icon">▣</div>
          <h2>How can I help you today?</h2>
          <p class="muted">Answers are generated only from your uploaded PDFs, with citations.</p>
          <div class="welcome-suggestions" id="suggestions"></div>
        </div>

        <div id="ingest-msg" class="ingest-msg" hidden></div>
      </main>

      <footer class="composer-wrap">
        <div class="composer">
          <label class="attach-btn" for="pdf-input" title="Upload PDF">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <textarea id="question-input" rows="1" placeholder="Ask anything"></textarea>
          <button id="ask-btn" class="send-btn" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <p class="composer-hint muted small">Answers cite your uploaded documents · Enter to send · Shift+Enter for a new line</p>
      </footer>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
